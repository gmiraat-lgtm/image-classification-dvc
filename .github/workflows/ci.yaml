# CI pipeline for the Image Classification DVC project
# Author: Miraat Gupta | PRN 23070126073 | AIML - A3
#
# Automatically executes the test stage (test.py) whenever code is
# pushed to the main or master branch. workflow_dispatch additionally
# allows a manual trigger from the Actions tab, which is convenient
# when capturing screenshots.

name: CI - Automated Testing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyyaml joblib matplotlib pytest

      - name: Run tests
        run: pytest test.py -v
