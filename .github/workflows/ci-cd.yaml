# ci-cd.yaml - CI/CD workflow for the Image Classification DVC project
# Author: Miraat Gupta | PRN 23070126073 | AIML - A3
#
# Runs on every push to main/master, and manually from the Actions tab.
# Three jobs run in sequence, each only if the previous one succeeded:
#
#   1. ci     - installs the dependencies and runs the automated test suite
#               (test.py) against the pipeline code and configuration
#   2. build  - pulls the trained artefacts produced by the DVC pipeline
#               (dvc.yaml) from the AWS S3 DVC remote, builds the Docker
#               image (Dockerfile), smoke-tests the container on the runner
#               and pushes the image to Docker Hub
#   3. deploy - logs into the AWS EC2 instance over SSH, replaces the running
#               container with this run's image, and verifies over the public
#               internet that the new version is live
#
# Repository secrets used:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  IAM user dvc-user (dvc pull from S3)
#   DOCKERHUB_TOKEN                           Docker Hub access token
#   EC2_HOST, EC2_USER                        public IP and login user of the instance
#   EC2_SSH_KEY_B64                           EC2 key pair (.pem), base64-encoded

name: CI/CD - Build and Deploy to AWS EC2

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ap-south-1
  DOCKERHUB_USER: miraatgupta
  IMAGE_NAME: image-classification-dvc
  APP_VERSION: ci-${{ github.run_number }}

jobs:

  ci:
    name: 1. CI - run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn pyyaml joblib matplotlib pytest

      - name: Run tests
        run: pytest test.py -v

  build:
    name: 2. Build and push Docker image
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install DVC with S3 support
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[s3]"
          dvc --version

      - name: Pull model artefacts from the AWS S3 DVC remote
        env:
          KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          KEY_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          AWS_ACCESS_KEY_ID="$(printf '%s' "$KEY_ID" | tr -d '[:space:]')"
          AWS_SECRET_ACCESS_KEY="$(printf '%s' "$KEY_SECRET" | tr -d '[:space:]')"
          export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
          dvc remote list
          dvc pull -r s3remote \
            models/model.joblib \
            data/features/selector.joblib \
            data/processed/X_test.npy \
            data/processed/y_test.npy
          ls -l models/model.joblib data/features/selector.joblib \
                data/processed/X_test.npy data/processed/y_test.npy

      - name: Build Docker image
        run: |
          IMAGE="$DOCKERHUB_USER/$IMAGE_NAME"
          docker build \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "$IMAGE:$APP_VERSION" \
            -t "$IMAGE:latest" \
            .
          docker images "$IMAGE"

      - name: Smoke-test the container on the runner
        run: |
          IMAGE="$DOCKERHUB_USER/$IMAGE_NAME:$APP_VERSION"
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8000/health -o health.json && break
            sleep 2
          done
          cat health.json; echo
          grep -q "\"version\":\"$APP_VERSION\"" health.json \
            || { echo "::error::Container did not report version $APP_VERSION"; docker logs smoke; exit 1; }
          curl -sf http://localhost:8000/sample | python -c "import json,sys; d=json.load(sys.stdin); print('Sample prediction:', d['predicted_class'], '| true:', d['true_class'])"
          docker rm -f smoke

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]' | docker login -u "$DOCKERHUB_USER" --password-stdin

      - name: Push image to Docker Hub
        run: |
          IMAGE="$DOCKERHUB_USER/$IMAGE_NAME"
          docker push "$IMAGE:$APP_VERSION"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$APP_VERSION and $IMAGE:latest"

  deploy:
    name: 3. Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH key
        env:
          EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$EC2_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keygen -y -f ~/.ssh/ec2_key > /dev/null \
            || { echo "::error::Secret EC2_SSH_KEY_B64 does not decode to a valid private key"; exit 1; }
          echo "SSH key ready"

      - name: Deploy container on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          LOGIN="$(printf '%s' "$EC2_USER" | tr -d '[:space:]')"
          IMAGE="$DOCKERHUB_USER/$IMAGE_NAME:$APP_VERSION"
          SSH="ssh -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          $SSH "$LOGIN@$HOST" true \
            || { echo "::error::EC2 refused the SSH login - check EC2_HOST, EC2_USER and EC2_SSH_KEY_B64"; exit 1; }
          printf '%s' "$DOCKERHUB_TOKEN" | tr -d '[:space:]' \
            | $SSH "$LOGIN@$HOST" "sudo docker login -u $DOCKERHUB_USER --password-stdin"
          $SSH "$LOGIN@$HOST" "set -e
            sudo docker pull $IMAGE
            sudo docker logout
            sudo docker rm -f image-classifier || true
            sudo docker run -d --name image-classifier --restart unless-stopped -p 80:8000 $IMAGE
            sudo docker image prune -af
            sudo docker ps --filter name=image-classifier"
          echo "Container image-classifier now runs $IMAGE"

      - name: Verify the deployment on the public URL
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          HOST="$(printf '%s' "$EC2_HOST" | tr -d '[:space:]')"
          for _ in $(seq 1 20); do
            if curl -sf "http://$HOST/health" -o live.json && grep -q "\"version\":\"$APP_VERSION\"" live.json; then
              break
            fi
            sleep 3
          done
          cat live.json; echo
          grep -q "\"version\":\"$APP_VERSION\"" live.json \
            || { echo "::error::The public endpoint is not serving $APP_VERSION"; exit 1; }
          echo "Deployment verified: $APP_VERSION is live on the EC2 public IP (port 80)"
